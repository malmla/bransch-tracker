<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LIA-tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Branschkartläggning-tracker</h1>
    </header>

    <main>
      <section class="card">
        <h2 id="form-title">Nytt företag</h2>
        <form id="application-form" novalidate>
          <input type="hidden" id="id" />
          <div class="grid">
            <label
              >Rangordning
              <input type="number" id="rank" min="1" step="1" />
            </label>
            <label
              >Företag
              <input type="text" id="company" required />
            </label>
            <label
              >Ort
              <input type="text" id="city" />
            </label>
            <label
              >Kontaktperson
              <input type="text" id="contactPerson" />
            </label>
            <label
              >E-post
              <input type="email" id="email" />
            </label>
            <label
              >Telefonnummer
              <input type="tel" id="phone" />
            </label>
          </div>
          <label
            >Kort presentation/motivering
            <span class="optional">(frivilligt)</span>
            <textarea id="motivation" rows="3"></textarea>
          </label>
          <label
            >Anteckningar
            <textarea id="notes" rows="3"></textarea>
          </label>
          <p id="error" class="error" role="alert" hidden></p>
          <div class="actions">
            <button type="submit" class="btn primary" id="submit-btn">
              Spara ansökan
            </button>
            <button type="button" class="btn" id="cancel-btn" hidden>
              Avbryt
            </button>
          </div>
        </form>
      </section>

      <section>
        <div class="dashboard" aria-label="Översikt">
          <div class="stat"><span class="stat-value" id="stat-total">0</span><span class="stat-label">Ansökningar totalt</span></div>
          <div class="stat"><span class="stat-value" id="stat-contact">0</span><span class="stat-label">Med kontaktperson</span></div>
          <div class="stat"><span class="stat-value" id="stat-email">0</span><span class="stat-label">Med e-post</span></div>
          <div class="stat"><span class="stat-value" id="stat-motivation">0</span><span class="stat-label">Med presentation/motivering</span></div>
        </div>
        <h2>
          Ansökningar <span id="count" class="badge">0</span>
          <button type="button" class="btn small export-btn" id="export-btn">
            Exportera till Excel
          </button>
          <button type="button" class="btn small" id="import-btn">
            Importera från Excel
          </button>
          <input type="file" id="import-file" accept=".xlsx,.xls" hidden />
        </h2>
        <p id="import-msg" class="error" role="alert" hidden></p>
        <div class="filters" aria-label="Filter">
          <label>Kontaktperson
            <select id="filter-contact" data-filter="contactPerson">
              <option value="">Alla</option><option value="has">Har</option><option value="missing">Saknas</option>
            </select>
          </label>
          <label>E-post
            <select id="filter-email" data-filter="email">
              <option value="">Alla</option><option value="has">Har</option><option value="missing">Saknas</option>
            </select>
          </label>
          <label>Telefon
            <select id="filter-phone" data-filter="phone">
              <option value="">Alla</option><option value="has">Har</option><option value="missing">Saknas</option>
            </select>
          </label>
          <button type="button" class="btn small" id="filter-reset">Rensa filter</button>
          <span id="filter-info" class="filter-info" hidden></span>
        </div>
        <ul id="list" class="list"></ul>
        <p id="empty" class="empty">Inga ansökningar ännu.</p>
      </section>
    </main>

    <dialog id="conflict-dialog" class="dialog">
      <h2>Företag finns redan</h2>
      <p>Dessa företag i Excel-filen finns redan i listan. Välj vilken version som ska gälla.</p>
      <div id="conflict-list"></div>
      <div class="actions">
        <button type="button" class="btn small" id="conflict-all-keep">Behåll alla befintliga</button>
        <button type="button" class="btn small" id="conflict-all-excel">Använd alla från Excel</button>
      </div>
      <div class="actions dialog-footer">
        <button type="button" class="btn primary" id="conflict-confirm">Fortsätt importen</button>
        <button type="button" class="btn" id="conflict-cancel">Avbryt</button>
      </div>
    </dialog>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
